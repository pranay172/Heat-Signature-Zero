<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 345" width="950" height="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker></defs>
<rect x="20" y="20" width="230" height="62" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="36" y="51" font-size="15.5" font-weight="700" fill="#e6edf3">Sensor time series</text>
<text x="36" y="70" font-size="12.5" fill="#9198a1">1D CNN  (avg + max pool)</text>
<line x1="254" y1="51" x2="296" y2="166" stroke="#656c76" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="20" y="98" width="230" height="62" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="36" y="129" font-size="15.5" font-weight="700" fill="#e6edf3">Sensor position (x, y)</text>
<text x="36" y="148" font-size="12.5" fill="#9198a1">MLP</text>
<line x1="254" y1="129" x2="296" y2="166" stroke="#656c76" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="20" y="176" width="230" height="62" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="36" y="207" font-size="15.5" font-weight="700" fill="#e6edf3">κ, boundary condition</text>
<text x="36" y="226" font-size="12.5" fill="#9198a1">embedding + MLP</text>
<line x1="254" y1="207" x2="296" y2="166" stroke="#656c76" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="20" y="254" width="230" height="62" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="36" y="285" font-size="15.5" font-weight="700" fill="#e6edf3">Global stats</text>
<text x="36" y="304" font-size="12.5" fill="#9198a1">max · mean · std · rise rate</text>
<line x1="254" y1="285" x2="296" y2="166" stroke="#656c76" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="300" y="126" width="150" height="80" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="316" y="157" font-size="15.5" font-weight="700" fill="#e6edf3">Fuse</text>
<text x="316" y="184" font-size="13" fill="#9198a1">per-sensor token</text>
<text x="316" y="204" font-size="13" fill="#9198a1">d = 256</text>
<line x1="454" y1="166" x2="496" y2="166" stroke="#656c76" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="500" y="96" width="190" height="140" rx="10" fill="#0f1d30" stroke="#4f94e8" stroke-width="1.5"/>
<text x="516" y="127" font-size="15.5" font-weight="700" fill="#e6edf3">Sensor encoder</text>
<text x="516" y="154" font-size="13" fill="#9198a1">self-attention</text>
<text x="516" y="174" font-size="13" fill="#9198a1">across sensors</text>
<text x="516" y="194" font-size="13" fill="#9198a1">× 3 layers</text>
<text x="516" y="214" font-size="13" fill="#9198a1">(masked, any M)</text>
<line x1="694" y1="166" x2="736" y2="166" stroke="#656c76" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="740" y="96" width="190" height="140" rx="10" fill="#0f1d30" stroke="#4f94e8" stroke-width="1.5"/>
<text x="756" y="127" font-size="15.5" font-weight="700" fill="#e6edf3">Source decoder</text>
<text x="756" y="154" font-size="13" fill="#9198a1">K = 3 learned queries</text>
<text x="756" y="174" font-size="13" fill="#9198a1">cross-attend to</text>
<text x="756" y="194" font-size="13" fill="#9198a1">sensor tokens</text>
<text x="756" y="214" font-size="13" fill="#9198a1">× 2 layers</text>
<line x1="835" y1="240" x2="835" y2="276" stroke="#656c76" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="740" y="280" width="190" height="62" rx="10" fill="#0f2417" stroke="#3fb950" stroke-width="1.5"/>
<text x="756" y="311" font-size="15.5" font-weight="700" fill="#e6edf3">Sigmoid heads</text>
<text x="756" y="330" font-size="12.5" fill="#9198a1">bounded (x, y, q) × K</text>
<text x="500" y="290" font-size="13" fill="#9198a1">Loss: MSE + 0.5·L1 after</text>
<text x="500" y="310" font-size="13" fill="#9198a1">Hungarian matching</text>
<text x="500" y="330" font-size="13" fill="#9198a1">(source order doesn't matter)</text>
</svg>
