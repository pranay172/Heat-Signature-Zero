<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="1080" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker></defs>
<rect x="20" y="20" width="220" height="118" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<circle cx="44" cy="46" r="12" fill="#818b98"/><text x="44" y="50.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f6f8fa">1</text>
<text x="64" y="51" font-size="15.5" font-weight="700" fill="#1f2328">Sensor data</text>
<text x="36" y="78" font-size="13" fill="#59636e">3–5 noisy time series</text>
<text x="36" y="98" font-size="13" fill="#59636e">+ positions, κ, boundary</text>
<line x1="244" y1="79.0" x2="276" y2="79.0" stroke="#818b98" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="280" y="20" width="220" height="118" rx="10" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="304" cy="46" r="12" fill="#2a78d6"/><text x="304" y="50.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f6f8fa">2</text>
<text x="324" y="51" font-size="15.5" font-weight="700" fill="#1f2328">Transformer prior</text>
<text x="296" y="78" font-size="13" fill="#59636e">one forward pass →</text>
<text x="296" y="98" font-size="13" fill="#59636e">initial (x, y, q) per source</text>
<line x1="504" y1="79.0" x2="536" y2="79.0" stroke="#818b98" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="540" y="20" width="220" height="118" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<circle cx="564" cy="46" r="12" fill="#818b98"/><text x="564" y="50.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f6f8fa">3</text>
<text x="584" y="51" font-size="15.5" font-weight="700" fill="#1f2328">Multi-start</text>
<text x="556" y="78" font-size="13" fill="#59636e">grid coverage + physics</text>
<text x="556" y="98" font-size="13" fill="#59636e">heuristics + NN guess</text>
<line x1="764" y1="79.0" x2="796" y2="79.0" stroke="#818b98" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="800" y="20" width="220" height="118" rx="10" fill="#fdf1eb" stroke="#eb6834" stroke-width="1.5"/>
<circle cx="824" cy="46" r="12" fill="#eb6834"/><text x="824" y="50.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f6f8fa">4</text>
<text x="844" y="51" font-size="15.5" font-weight="700" fill="#1f2328">Coarse screening</text>
<text x="816" y="78" font-size="13" fill="#59636e">every start scored on a</text>
<text x="816" y="98" font-size="13" fill="#59636e">cheap 50×25 grid</text>
<rect x="20" y="200" width="220" height="118" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<circle cx="44" cy="226" r="12" fill="#818b98"/><text x="44" y="230.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f6f8fa">5</text>
<text x="64" y="231" font-size="15.5" font-weight="700" fill="#1f2328">Diversity selection</text>
<text x="36" y="258" font-size="13" fill="#59636e">greedy: good loss AND</text>
<text x="36" y="278" font-size="13" fill="#59636e">≥ τ apart from the rest</text>
<line x1="244" y1="259.0" x2="276" y2="259.0" stroke="#818b98" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="280" y="200" width="220" height="118" rx="10" fill="#fdf1eb" stroke="#eb6834" stroke-width="1.5"/>
<circle cx="304" cy="226" r="12" fill="#eb6834"/><text x="304" y="230.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f6f8fa">6</text>
<text x="324" y="231" font-size="15.5" font-weight="700" fill="#1f2328">Niching refinement</text>
<text x="296" y="258" font-size="13" fill="#59636e">BO → L-BFGS-B; later runs</text>
<text x="296" y="278" font-size="13" fill="#59636e">repelled from found basins</text>
<line x1="504" y1="259.0" x2="536" y2="259.0" stroke="#818b98" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="540" y="200" width="220" height="118" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<circle cx="564" cy="226" r="12" fill="#818b98"/><text x="564" y="230.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f6f8fa">7</text>
<text x="584" y="231" font-size="15.5" font-weight="700" fill="#1f2328">Score-aware filter</text>
<text x="556" y="258" font-size="13" fill="#59636e">keep a candidate only if</text>
<text x="556" y="278" font-size="13" fill="#59636e">it raises expected score</text>
<line x1="764" y1="259.0" x2="796" y2="259.0" stroke="#818b98" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="800" y="200" width="220" height="118" rx="10" fill="#ecf7ef" stroke="#1a7f37" stroke-width="1.5"/>
<text x="816" y="231" font-size="15.5" font-weight="700" fill="#1f2328">≤ 3 candidates</text>
<text x="816" y="258" font-size="13" fill="#59636e">accurate and mutually</text>
<text x="816" y="278" font-size="13" fill="#59636e">distinct source sets</text>
<path d="M910.0,142 V169.0 H130.0 V195" fill="none" stroke="#818b98" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="20" y="375" width="1042" height="50" rx="10" fill="#fdf1eb" stroke="#eb6834" stroke-width="1.5"/>
<text x="40" y="406" font-size="15" font-weight="700" fill="#1f2328">Heat2D simulator</text>
<text x="182" y="406" font-size="14" fill="#59636e">·  the official ADI solver, Numba-JIT accelerated  ·  every candidate is judged by its forward RMSE</text>
<line x1="390.0" y1="371" x2="390.0" y2="324" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M1050,375 V79.0 H1026" fill="none" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
